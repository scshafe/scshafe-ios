name: CI

# BASE-04. Added by scshafe-dev (the native kind). It runs
# dev.toml [verify] command (BASE-06): keep the two equal.
#
# No language, build system or platform is assumed. ubuntu-latest has common
# toolchains preinstalled (a C/C++ compiler, cmake, Python, Node, Go, Rust);
# add the setup your [verify] command needs before it (packages, an SDK, a
# toolchain action pinned by SHA). To build on other platforms, use a matrix
# of GitHub-hosted runners (macos-latest, windows-latest); dev check lists
# them (NATIVE-01). A release or store upload is a workflow of its own.
#
# Two jobs: `verify` is dev.toml [verify] on Linux (the token --check and the
# Python tests; no Xcode needed), `ios` builds the Swift package and runs its
# tests on a pinned iPhone simulator (iPhone 17, iOS 26.5: snapshots compare
# only on the device and OS that recorded them). NATIVE-01: macos-26 with
# Xcode 26.6 selected, as homemesh and mailroom-ios pin it. No Xcode 27 leg
# until the macos-26 image has a stable one (docs/design.md, 10).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify (dev.toml [verify] command)
        run: |
          ./scripts/verify

  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Build and test the package (iOS simulator)
        run: |
          set -o pipefail
          xcodebuild test -scheme scshafe-ios-Package \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=26.5" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" \
            | grep -E --line-buffered '(error:|warning:|Test |✔|✘|\*\* )' || true
          grep -q '\*\* TEST SUCCEEDED \*\*' "$RUNNER_TEMP/xcodebuild.log"
      # The Catalog host app builds so it cannot rot. XcodeGen is pinned by release and
      # checked by hash.
      - name: Build the Catalog (XcodeGen, iOS simulator)
        run: |
          set -o pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec Catalog/project.yml
          xcodebuild build -project Catalog/ScshafeCatalog.xcodeproj -scheme ScshafeCatalog \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=26.5" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/catalog.log" \
            | grep -E --line-buffered '(error:|\*\* )' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/catalog.log"
      # Snapshot references are recorded on this runner image; a missing or
      # differing one fails the test and uploads the images to commit or inspect.
      - name: Upload snapshots
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: snapshots
          path: Tests/**/__Snapshots__
          if-no-files-found: ignore
