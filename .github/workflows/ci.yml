name: CI

# BASE-04. Added by scshafe-dev (the native kind). It runs
# dev.toml [verify] command (BASE-06): keep the two equal.
#
# No language, build system or platform is assumed. ubuntu-latest has common
# toolchains preinstalled (a C/C++ compiler, cmake, Python, Node, Go, Rust);
# add the setup your [verify] command needs before it (packages, an SDK, a
# toolchain action pinned by SHA). To build on other platforms, use a matrix
# of GitHub-hosted runners (macos-latest, windows-latest); dev check lists
# them (NATIVE-01). A release or store upload is a workflow of its own.
#
# Two jobs: `verify` is dev.toml [verify] on Linux (the token --check and the
# Python tests; no Xcode needed), `ios` builds the Swift package and runs its
# tests on an iPhone simulator. NATIVE-01: macos-26 with Xcode 26.6 selected,
# as homemesh and mailroom-ios pin it. The design (docs/design.md) settles the
# pinned simulator, snapshot tests and an Xcode 27 leg.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify (dev.toml [verify] command)
        run: |
          ./scripts/verify

  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      # The newest iOS runtime's first iPhone, until the design pins one.
      - name: Pick an iPhone simulator
        id: sim
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - "$RUNNER_TEMP/devices.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          best = None
          for runtime, entries in devices.items():
              if ".SimRuntime.iOS-" not in runtime:
                  continue
              version = tuple(int(p) for p in runtime.rsplit("iOS-", 1)[1].split("-"))
              for dev in entries:
                  if dev["name"].startswith("iPhone") and (best is None or version > best[0]):
                      best = (version, dev["udid"], dev["name"])
          if best is None:
              sys.exit("no available iPhone simulator")
          print(f"udid={best[1]}")
          print(f"iPhone simulator: {best[2]}, iOS {'.'.join(map(str, best[0]))}", file=sys.stderr)
          PY
      - name: Build and test the package (iOS simulator)
        run: |
          set -o pipefail
          xcodebuild test -scheme scshafe-ios-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" \
            | grep -E --line-buffered '(error:|warning:|Test |✔|✘|\*\* )' || true
          grep -q '\*\* TEST SUCCEEDED \*\*' "$RUNNER_TEMP/xcodebuild.log"
