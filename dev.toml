# Project intent (BASE-01). The schema is illustrative until M2/M7 fix it.
schema_version = 1

[project]
id = "scshafe-ios"
class = "managed"

# A native, desktop or game application: no language, build system or
# package manager is assumed; [verify] is how this one is built and tested.
#
# A Swift package (a SwiftUI library), checked as a scshafe-dev `native`
# project until scshafe-dev has a Swift library kind. scshafe-dev 0.16.0 has
# no fitting library kind: `library` is npm-only (LIB-*: pnpm toolchain, npm
# release kit), and `tool` is for Python or shell command-line programs
# (scshafe-qt, a Python library, is a `tool` for that reason). `native` assumes
# no language, runs [verify] in ci.yml and allows macOS runners (NATIVE-01),
# and is the kind of the iOS apps this library serves (parley, mailroom-ios,
# jobtrack-ios). [verify] runs on Linux (the PC has no Xcode); the Swift build
# and tests are ci.yml's `ios` job on macos-26.
[app]
kind = "native"

# BASE-06: the one command that verifies this repository, run from its root
# by .github/workflows/ci.yml and by hand on the checkout under review. Keep
# the two equal.
[verify]
command = "./scripts/verify"

[skills]
# BASE-05 asks for .agents/skills; the catalog is M4. Recorded gap.
selected = []

# Adopted, not generated (D-6): `dev adopt --add-missing` added this file to
# an existing native project on 2026-10-30. It records which scshafe-dev
# standard the repository was adopted under; it does not claim scshafe-dev
# rendered this repository's files, and the ones that existed were left as
# they are.
[template]
source = "scshafe/scshafe-dev"
version = "0.16.0"
commit = "31b678701850c9992b5c99006765618e4f7eb15f"
released = true
dirty = false
mode = "adopted"
params = { kind = "native", name = "scshafe-ios", date = "2026-10-30" }

# IDENT-01: what this project's agent may do (scshafe/infra docs/platform/agent-identity.md).
# References, never secrets. `dev identity plan` compares it with the host and GitHub.
[identity]
agent = "agent-scshafe-ios"
github = ["contents=write", "pull_requests=write", "issues=write", "workflows=write", "actions=write"]
